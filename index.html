<body>

    <div class="container-fluid">
        <div class="jumbotron img_banner_hpbd">
            <div class="text-center" style="background: linear-gradient(135deg, #ffb7d5, #f9d7e8); border: 1px solid #f4bfd8;">
                <h1 style="color: #d63384; margin: 0; padding: 12px 0;">TO: THÁI PHAN DÁNG NGỌC</h1>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row ">
            <div class="col-xs-4 col-md-4 col-sm-4">

                    </button> -->
                    <p></p>
            </div>

                    </button> -->

                    src="img/Winter happy birthday.jpg" alt="80x80px" style="height: 360px">
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                    <h4 class="modal-title" id="myModalLabel" style="color: #d63384;">Thiệp sinh nhật</h4>

                </div>
                <div class="modal-body">
                    <div class="containeri">
                        <img class="img img-responsive" src="img/Winter happy birthday.jpg" alt="80x80px" style="height: 560px">
                        <audio controls autoplay>
                            <source src="ms/hpbd.MP3" type="audio/ogg" />
                            <source src="ms/hppd.MP3" type="audio/mpeg" />
                            <a href="#">horse</a>
                        </audio>
                    </div>
                    <div class="text-center" style="position: relative; margin: 18px 0 20px; padding: 22px 18px 18px; border-radius: 16px; background: linear-gradient(135deg, #fff2f8, #ffe1ee); box-shadow: 0 4px 18px rgba(214, 51, 132, 0.12); font-family: 'Nunito Sans', sans-serif; color: #d63384; line-height: 1.8; border: 1px solid #f7bfd6;">
                        <div style="display: flex; justify-content: flex-end; margin-bottom: 6px; padding-right: 4px;">
                            <img src="tpdn3.png" alt="tpdn3" style="width: 72px; height: 72px; object-fit: cover; border-radius: 12px; box-shadow: 0 2px 10px rgba(214, 51, 132, 0.15);">
                        </div>
                        <h3 style="margin: 0 0 12px; font-weight: 700; color: #d63384;">Tèn tenn!</h3>
                        <p style="margin: 0; font-size: 18px;">Tuổi mới hãy cứ vô tư hồn nhiên nhóoo,</p>
                        <p style="margin: 0; font-size: 18px;">Chặng đường phía trước có lỡ mệt mỏi hayy thì cứ quay qua tìm tuii nhooo,</p>
                        <p style="margin: 0; font-size: 18px;">Có tuii ở đây gòii khong cần gồng mình nữa nhaaa.</p>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 0 8px;">
                            <img src="tpdn2.png" alt="tpdn2" style="width: 80px; height: 80px; object-fit: cover; border-radius: 12px; box-shadow: 0 2px 10px rgba(214, 51, 132, 0.15);">
                            <span></span>
                        </div>
                        <p style="margin: 8px 0 0; font-size: 12px; font-weight: 700; color: #d63384; text-align: right; padding-right: 8px; letter-spacing: 0.5px;">nvang</p>
                    </div>
                    <div class="containeri">
                        <img class="img img-responsive" src="tpdn.jpg">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal" style="color: #d63384; border-color: #f4bfd8; background: #fff7fb;">Cancel</button>
                    <button type="button" class="btn btn-primary" style="background: #d63384; border-color: #d63384;">OK</button>
                </div>
            </div>
        </div>
